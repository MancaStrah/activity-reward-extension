services:
  redis:
    # digest-pinned: a floating tag would silently change
    # the queue-storage image between two runs of the same commit
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    image: ${REGISTRY:-local}/tee-proxy
    volumes:
      - ./config/proxy/extension_proxy.docker.toml:/app/config/config.toml:ro
    environment:
      # No default: the proxy signs the /info response that clients trust for the TEE
      # public key, so a well-known fallback key would help anyone impersonate it.
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:?set PROXY_PRIVATE_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Internal port (6663): the TEE<->proxy queue API has NO application auth and
      # de-queues actions on an unauthenticated POST /queue/*, so upstream tee-proxy
      # requires it stay off the network. Published to host loopback only — and only
      # on the local-devnet profile: the coston/coston2 overlays `!override` this
      # list and drop the internal publish entirely. Override
      # EXT_PROXY_INTERNAL_BIND only for a firewalled/mTLS'd host.
      - "${EXT_PROXY_INTERNAL_BIND:-127.0.0.1:6673}:6663"
      # External port (6664): the public /info + result API clients reach (via the tunnel).
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    build:
      context: .
      # Selected by LANGUAGE in .env; start-services.sh resolves <LANGUAGE>/Dockerfile
      # by directory convention. Adding a language needs no change here.
      dockerfile: ${EXTENSION_DOCKERFILE:-go/Dockerfile}
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
        # Consumed by language images that build tee-node from source. A Go
        # pseudo-version pin is a commit SHA, not a tag — see scripts/lib/versions.sh.
        TEE_NODE_REF: ${TEE_NODE_REF:-}
    env_file:
      - path: ./config/extension.env
        required: false
    environment:
      # No defaults for the attestation posture. `docker compose up` run directly
      # bypasses scripts/lib/profile.sh entirely — no profile is resolved, no
      # MODE/SIMULATED_TEE/attestation matrix is validated, and the proxy config is
      # never cross-checked. A default of MODE=1 therefore meant the bypass path
      # silently chose SIMULATED attestation, which proves nothing about the code it
      # signs for. Requiring both values makes that path state its posture out loud,
      # the same way PROXY_PRIVATE_KEY above refuses a fallback. start-services.sh
      # exports the values the pre-flight validated, so the supported flow is
      # unaffected; both shipped templates set them explicitly.
      - MODE=${MODE:?set MODE in .env (0 = Confidential Space attestation, 1 = SIMULATED/none) — or start via ./scripts/start-services.sh, which validates the whole profile}
      # Chain id the node binds signatures to — must match the proxy's chain_id
      # and the chain itself. Local e2e Hardhat = 31337; the coston/coston2
      # overrides set 16/114 for those networks.
      - CHAIN_ID=${CHAIN_ID:-31337}
      - INITIAL_OWNER=${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}
      # TEE governance the node signs with. Must match what set-governance
      # registers on-chain (post-build reads the same vars). Defaults to the
      # deployer (INITIAL_OWNER) as sole signer, threshold 1; override in .env.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIMULATED_TEE=${SIMULATED_TEE:?set SIMULATED_TEE in .env — it must agree with MODE (MODE=1 needs true, MODE=0 needs false)}
    depends_on:
      - ext-proxy

  # Public decoding service: turns raw instruction messages/results into JSON.
  # Same image as extension-tee, second binary — no TEE node inside.
  # Distroless image → exec-form command, no shell-based healthcheck.
  types-server:
    build:
      context: .
      dockerfile: ${EXTENSION_DOCKERFILE:-go/Dockerfile}
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
        TEE_NODE_REF: ${TEE_NODE_REF:-}
    command: ["/app/types-server"]
    environment:
      - TYPES_SERVER_PORT=8100
      # Bind all interfaces INSIDE the container so Docker's port publish can reach
      # it; external exposure is governed by the host-side bind below, not this.
      - TYPES_SERVER_HOST=0.0.0.0
    # Published to the host loopback by default — the types-server is unauthenticated,
    # so it is not exposed on every host interface unless an operator opts in with
    # TYPES_SERVER_BIND=0.0.0.0:8100.
    ports:
      - "${TYPES_SERVER_BIND:-127.0.0.1:8100}:8100"

networks:
  # A private network of this project's own, like the coston/coston2 overlays.
  #
  # It used to join a pre-existing, shared `docker_default`. Docker networks carry no
  # port-level isolation, so every container on a shared network could reach the two
  # unauthenticated APIs here regardless of what `ports:` publishes: tee-node's config
  # server, which binds all interfaces inside the container and accepts POSTs that set
  # the chain id, extension id, initial owner, governance signer set and proxy URL with
  # no authentication whatsoever; and the proxy's internal queue API on 6663. Sharing
  # a network with unrelated containers therefore handed any of them the node's
  # configuration.
  #
  # Nothing needed that network: this profile reaches the chain node and the indexer DB
  # over host.docker.internal (see the comment at the top of
  # config/proxy/extension_proxy.docker.toml), and the only container-name reference in
  # play — redis — is a service in this same file. Point COMPOSE_NETWORK at an existing
  # network only if you have a reason to, and read the paragraph above first.
  default:
    name: ${COMPOSE_NETWORK:-activity-reward-extension-local}
    external: false
